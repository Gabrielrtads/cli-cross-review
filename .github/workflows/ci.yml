name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run PowerShell & Node.js Test Suite
        shell: pwsh
        run: |
          node scripts/invoke-cross-model-review.test.mjs

      - name: Verify Python Tribunal Runner
        run: |
          python scripts/tribunal_runner.py --help
