name: CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run PowerShell & Node.js Test Suite
        shell: pwsh
        run: |
          node --test scripts/invoke-cross-model-review.test.mjs scripts/invoke-parallel-runner.test.mjs

      - name: Verify Python Tribunal Runner
        run: |
          python scripts/tribunal_runner.py --help

  bash-test:
    name: Run Bash Runner Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Bash dependencies
        run: command -v bash && command -v jq && command -v timeout
      - name: Run Bash regression tests
        run: node --test scripts/invoke-parallel-runner.test.mjs
